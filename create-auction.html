<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Nowa aukcja</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h2>Tworzenie aukcji</h2>
    <nav>
        <a href="index.html">Ekran główny</a>
        <button id="connectWalletBtn" class="btn" style="background-color: #f6851b; margin-left: 20px;">Połącz MetaMask</button>
    </nav>
</header>

<div class="container">
    <div class="card">
        <form id="form">
            <input id="title" placeholder="Tytuł" required>
            <textarea id="desc" placeholder="Opis"></textarea>

            <label for="type">Typ aukcji:</label>
            <select id="type">
                <option value="dutch">Holenderska (Dutch) — cena spada</option>
                <option value="english">Klasyczna (English) — cena rośnie</option>
            </select>

            <label for="price" id="priceLabel">Cena początkowa (ETH):</label>
            <input id="price" type="number" step="0.01" min="0"
                   placeholder="Cena / Minimalna oferta (ETH)" required>

            <small id="priceHint" style="color: #888;">
                Dutch: cena startowa (minimum = połowa). English: minimalna kwota pierwszej oferty.
            </small>

            <select id="currency">
                <option>ETH</option>
            </select>

            <input type="file" id="image" accept="image/*">

            <button class="btn" type="submit">Utwórz Aukcję</button>
        </form>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script src="js/blockchain.js"></script>
<script src="js/createAuction.js"></script>

<script>
    // Dynamiczna zmiana etykiety przy zmianie typu
    document.getElementById("type").addEventListener("change", function () {
        const hint = document.getElementById("priceHint");
        if (this.value === "dutch") {
            hint.innerText = "Dutch: cena startowa (minimum = połowa). Czas trwania: 1 dzień.";
        } else {
            hint.innerText = "English: minimalna kwota pierwszej oferty. Czas trwania: 1 dzień.";
        }
    });
</script>

</body>
</html>
