<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Nowa aukcja</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h2>Tworzenie aukcji</h2>
    <nav>
        <a href="index.html">Ekran główny</a>
        <button id="connectWalletBtn" class="btn" style="background-color: #f6851b; margin-left: 20px;">Połącz MetaMask</button>
    </nav>
</header>

<div class="container">
    <div class="card">
        <form id="form">
            <input id="title" placeholder="Tytuł" required>
            <textarea id="desc" placeholder="Opis"></textarea>

            <select id="type">
                <option>Holenderska (Dutch)</option>
                <option>Klasyczna (English)</option>
            </select>

            <input id="price" type="number" step="0.01" placeholder="Cena początkowa (w ETH)">

            <select id="currency">
                <option>ETH</option>
            </select>

            <input type="file" id="image" accept="image/*">

            <button class="btn">Utwórz Aukcję</button>
        </form>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<script src="js/blockchain.js"></script>
<script src="js/createAuction.js"></script>
</body>
</html>
